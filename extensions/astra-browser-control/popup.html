<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: system-ui, sans-serif; width: 320px; margin: 0; padding: 14px; }
    h1 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #999; }
    .dot.on { background: #2fa14a; }
    .dot.off { background: #c33; }
    label { display: block; font-size: 12px; margin: 10px 0 4px; color: #444; }
    input { width: 100%; box-sizing: border-box; font: 12px ui-monospace, monospace; padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
    .row { display: flex; gap: 8px; margin-top: 12px; }
    button { flex: 1; padding: 7px; border: 0; border-radius: 4px; cursor: pointer; font-size: 13px; }
    #connect { background: #2b6cb0; color: #fff; }
    #disconnect { background: #eee; color: #333; }
    #error { color: #c33; font-size: 11px; margin-top: 8px; min-height: 14px; word-break: break-word; }
    a { font-size: 11px; color: #2b6cb0; }
  </style>
</head>
<body>
  <h1><span class="dot" id="dot"></span>Astra Browser Control</h1>
  <div id="status">Loading…</div>
  <label for="serverUrl">Server URL (ws://localhost:PORT)</label>
  <input id="serverUrl" placeholder="ws://localhost:8799/extension">
  <label for="token">Pairing token</label>
  <input id="token" type="password" placeholder="Paste the token from Astra">
  <div class="row">
    <button id="connect">Connect</button>
    <button id="disconnect">Disconnect</button>
  </div>
  <div id="error"></div>
  <a href="options.html" target="_blank">Advanced settings →</a>
  <script src="popup.js"></script>
</body>
</html>
